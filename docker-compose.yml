services:
  app:
    build: .
    image: kr2-app:1.0
    container_name: kr2-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      STUDENT: ${STUDENT:-unknown}
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    user: "1000:1000"   # соответствует uid из Dockerfile

  redis:
    image: redis:7-alpine
    container_name: kr2-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"]
    volumes:
      - redis_data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    # порт 6379 специально НЕ публикуем

networks:
  backend:
    driver: bridge

volumes:
  redis_data: